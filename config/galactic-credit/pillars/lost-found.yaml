# yaml-language-server: $schema=../schema/pillar.schema.json
# Optional island for systems you declare that no team owns. The id lost-found is reserved: it always stands last.
pillar: lost-found
displayName: Lost & found
color: "#9aa3ad"
systems:
  - { id: lost-found.batch-gateway-api, service: batch-gateway, name: Batch gateway API, role: api, calls: [lost-found.batch-gateway-db] }
  - { id: lost-found.batch-gateway-worker, service: batch-gateway, name: Batch gateway worker, role: worker, calls: [lost-found.batch-gateway-db] }
  - { id: lost-found.batch-gateway-db, service: batch-gateway, name: Batch gateway DB, role: db, engine: sqlserver }
  - { id: lost-found.legacy-ftp-api, name: Legacy file drop, role: api }

# The old way: this worker still reads the hub's exports topic instead of a pillar's outbox. Flagged legacy.
messaging:
  subscriptions:
    - { topic: hub-exports, consumer: lost-found.batch-gateway-worker, legacy: true }

# yaml-language-server: $schema=../schema/pillar.schema.json
pillar: ntf
displayName: Notifications
color: "#ff9f1c"
systems:
  - { id: ntf.dispatch-api, service: dispatch, name: Dispatch API, role: api, calls: [ntf.dispatch-db, ntf.templates-api] }
  - { id: ntf.dispatch-worker, service: dispatch, name: Dispatch worker, role: worker, calls: [ntf.dispatch-db] }
  - { id: ntf.dispatch-db, service: dispatch, name: Dispatch DB, role: db }
  - { id: ntf.templates-api, service: templates, name: Templates API, role: api, calls: [ntf.templates-db] }
  - { id: ntf.templates-db, service: templates, name: Templates DB, role: db }
  - { id: ntf.digest-cron, name: Digest run, role: function, calls: [ntf.dispatch-api] }

# Messaging: the outboxes this pillar publishes (ntf-<service>-outbox) and the topics its workers consume.
messaging:
  topics: [dispatch]
  subscriptions:
    - { topic: cl-posting-outbox, consumer: ntf.dispatch-worker }
    - { topic: col-dunning-outbox, consumer: ntf.dispatch-worker }
    - { topic: dsp-disputes-outbox, consumer: ntf.dispatch-worker }

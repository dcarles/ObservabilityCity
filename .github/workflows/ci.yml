name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Backend tests
        run: dotnet test ObservabilityCity.sln
      - name: Web install
        run: npm ci
        working-directory: web
      - name: Contracts match the C# records
        run: npm run check:contracts
        working-directory: web
      - name: Web typecheck, tests and build
        run: |
          npm run typecheck
          npm test
          npm run build
        working-directory: web

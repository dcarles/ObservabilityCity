<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Observability City</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8F%99%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="town"></canvas>
    <!-- the search box sits between the two redrawn halves of the bar, so a redraw never takes its focus away -->
    <header id="topbar">
      <div id="topbar-left" class="dyn"></div>
      <div id="view-bar"></div>
      <div id="search"><input id="search-input" type="search" placeholder="Search systems and islands  ( / )" autocomplete="off" spellcheck="false" /><div id="search-results" class="picker-results" hidden></div></div>
      <div id="topbar-right" class="dyn"></div>
      <div id="tools">
        <button id="more-button" title="More: Wall, Dashboard, Day or Dusk" aria-label="More" aria-expanded="false" hidden>⋯</button>
        <select id="view-switch" class="view-select" aria-label="View" title="How to look at the data"><option value="town">View: Town</option><option value="dashboard">View: Dashboard</option><option value="architecture">View: Architecture</option></select>
        <button id="wall-button" title="Wall mode: full screen, a tour and a big status strip, for a screen nobody touches">Wall</button>
        <button id="lighting" title="Switch between Day and Dusk">Day</button>
        <button id="legend-button" title="What things mean" aria-label="Legend">?</button>
        <button id="home" title="Frame the whole town">Home</button>
      </div>
    </header>
    <div id="more-menu" hidden></div>
    <div id="dash-root" hidden>
      <header id="dash-menu">
        <div class="wrap">
          <span class="brand" id="dash-brand"></span>
          <select id="view-select" class="view-select" aria-label="View" title="How to look at the data"><option value="town">View: Town</option><option value="dashboard">View: Dashboard</option><option value="architecture">View: Architecture</option></select>
          <span id="dash-filters"></span>
          <span class="vb"><button class="btn" id="pillars-button" aria-expanded="false"><span id="pillars-button-label">Pillars</span> ▾</button><div id="pillar-menu" hidden></div></span>
          <span class="sp"></span>
          <span class="dl"><button class="btn" id="dash-legend-button" aria-expanded="false" aria-label="What the colours mean" title="What the colours mean">?</button><div id="dash-legend" hidden></div></span>
          <button class="btn" id="wall-button-dash" title="Wall mode: big text, a tour of what needs attention, for a screen nobody touches">Wall</button>
          <button class="btn" id="dash-theme" title="Switch between light and dark">Dark</button>
          <span class="fresh"><button class="btn" id="fresh-button" aria-expanded="false">Connecting…</button><div id="fresh-pop" hidden></div></span>
          <span class="livepill wait" id="dash-status"><i class="dot"></i><span>Connecting…</span></span>
        </div>
      </header>
      <div id="arch-root" hidden>
        <div class="arch-sum" id="arch-sum"></div>
        <div class="arch-stage" id="arch-stage">
          <svg id="arch-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture diagram"></svg>
          <div class="arch-empty" id="arch-empty" hidden>Nothing to show. Every pillar is hidden, or the town has none.</div>
          <div class="arch-look min" id="arch-look">
            <div class="lh"><button class="tog" id="arch-look-toggle" aria-expanded="false">Visualisation options</button><button class="lx" id="arch-look-x" aria-label="Hide options">×</button></div>
            <div class="body"></div>
          </div>
          <div class="arch-zoom"><button id="arch-zoom-in" title="Zoom in" aria-label="Zoom in">+</button><button id="arch-zoom-out" title="Zoom out" aria-label="Zoom out">−</button><button id="arch-fit" title="Fit the whole diagram" aria-label="Fit">Fit</button></div>
          <div class="arch-pick" id="arch-pick"></div>
        </div>
      </div>
      <div class="wrap">
        <div class="sum" id="dash-sum"></div>
        <h2 id="dash-pillars-title">Pillars</h2>
        <div id="dash-pillars"></div>
        <div id="hidden-pillars"></div>
        <h2>More</h2>
        <div id="dash-sections"></div>
        <div id="dash-more"></div>
      </div>
    </div>
    <aside id="break-panel" hidden></aside>
    <section id="story-bar" hidden></section>
    <div id="state-list" hidden></div>
    <aside id="service-panel" hidden></aside>
    <aside id="inspector" hidden></aside>
    <aside id="legend" hidden></aside>
    <div id="tooltip" hidden></div>
    <div id="unknown-hosts" hidden></div>
    <div id="notices" hidden></div>
    <div id="banner" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# yaml-language-server: $schema=../schema/pillar.schema.json
# A pillar with no messaging: a reporting API with a cache that reads the shared customer and reference DBs on the hub. No worker, no database of its own,
# no pier. The bridge exists because it has an API and links to the hub's databases.
pillar: reg
displayName: Regulatory Reporting
color: "#6d9dc5"
defaults:
  api: { slaP99Ms: 1500 }
systems:
  - { id: reg.reports-api, service: reporting, name: Reports API, role: api, external: true, calls: [hub.customer-db, hub.reference-db, reg.rules-cache] }
  - { id: reg.rules-cache, service: reporting, name: Rules cache, role: cache }

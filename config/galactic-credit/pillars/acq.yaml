# yaml-language-server: $schema=../schema/pillar.schema.json
pillar: acq
displayName: Acquisition
color: "#ef8354"
external: true
defaults:
  api: { slaP99Ms: 700 }
systems:
  - { id: acq.applications-api, service: applications, name: Applications API, role: api, calls: [acq.applications-db, acq.offers-api], gatewayCalls: [dec.decision-api, cus.kyc-api] }
  - { id: acq.applications-worker, service: applications, name: Applications worker, role: worker, calls: [acq.applications-db] }
  - { id: acq.applications-db, service: applications, name: Applications DB, role: db }
  - { id: acq.offers-api, service: offers, name: Offers API, role: api, calls: [acq.offers-db] }
  - { id: acq.offers-db, service: offers, name: Offers DB, role: db }
  - { id: acq.leads-api, service: leads, name: Leads API, role: api, calls: [acq.leads-db, acq.applications-api], gatewayCalls: [cus.profile-api] }
  - { id: acq.leads-worker, service: leads, name: Leads worker, role: worker, calls: [acq.leads-db] }
  - { id: acq.leads-db, service: leads, name: Leads DB, role: db }

# Messaging: the outboxes this pillar publishes (acq-<service>-outbox) and the topics its workers consume.
messaging:
  topics: [applications]
  subscriptions:
    - { topic: dec-decision-outbox, consumer: acq.applications-worker }
    - { topic: cus-profile-outbox, consumer: acq.leads-worker }

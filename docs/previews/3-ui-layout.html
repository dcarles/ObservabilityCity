.ui{position:absolute;inset:0;font-size:clamp(7px,1.05cqw,13px)}
.p{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:.8em;box-shadow:0 .3em 1.2em rgba(0,0,0,.12)}
.row{display:flex;align-items:center;gap:.8em}
.top{left:1em;right:1em;top:1em;padding:.6em 1em;justify-content:space-between}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:.4em}.btns span{border:1px solid var(--line);border-radius:.5em;padding:.35em .5em;font-size:.9em}
.chip{margin-top:.6em;background:var(--chip);border-radius:.5em;padding:.4em .6em;font-size:.9em}
.bar{height:.35em;background:var(--line);border-radius:1em;margin-top:.3em}.bar i{display:block;height:100%;width:65%;background:var(--accent);border-radius:1em}
.right{right:1em;top:5.2em;bottom:5.4em;width:20em;padding:1em;display:flex;flex-direction:column;gap:.7em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:.5em}.kv div{background:var(--chip);border-radius:.5em;padding:.4em .6em}.kv small{display:block;color:var(--muted);font-size:.8em}
.status{color:#fff;background:var(--red);border-radius:2em;padding:.15em .7em;font-size:.85em}
.tabsm{display:flex;gap:1em;border-bottom:1px solid var(--line);padding-bottom:.3em;font-size:.9em}.tabsm span:first-child{font-weight:600;border-bottom:2px solid var(--accent)}
.log{font-family:ui-monospace,monospace;font-size:.8em;color:var(--muted);line-height:1.6}
.story{left:50%;transform:translateX(-50%);bottom:1em;width:46em;padding:.6em 1em}
.track{flex:1;height:.35em;background:var(--line);border-radius:1em;position:relative}.track i{position:absolute;left:0;top:0;bottom:0;width:40%;background:var(--accent);border-radius:1em}
.caption{position:absolute;left:50%;transform:translateX(-50%);bottom:5em;background:rgba(20,24,36,.85);color:#fdf6e8;padding:.5em 1em;border-radius:.6em}
.bottomdrawer{left:1em;right:1em;bottom:1em;height:30%;padding:1em;display:grid;grid-template-columns:16em 1fr 1fr;gap:1.2em}
.toolbar{left:50%;transform:translateX(-50%);bottom:1em;padding:.5em .8em}
.toolbar span{border:1px solid var(--line);border-radius:.5em;padding:.3em .7em}
.legend{right:1em;top:5.2em;width:19em;padding:1em;font-size:.95em}.legend ul{margin:0;padding-left:1.1em;line-height:1.6}
.callout{position:absolute;background:var(--accent);color:#fff;border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center;font-weight:600;font-size:.9em;z-index:2}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.notes ol{margin:0;padding-left:1.3em;line-height:1.55}
@media (max-width:560px){.tabs button{flex:1 1 100%}}
</style></head><body>
<div class="wrap">
<h1>Town UI layout</h1>
<p class="sub">Where the controls sit around the 3D town. The panels are drawn over a still frame of the preview. Numbered dots match the notes below.</p>
<div class="tabs" role="group" aria-label="Layout">
<button data-l="a" aria-pressed="true">A · Side drawer (inspector on the right)</button>
<button data-l="b" aria-pressed="false">B · Bottom drawer</button>
<button data-l="legend" aria-pressed="false">Legend open (either layout)</button>
</div>
<div class="screen"><div class="ui" id="ui"></div></div>
<div class="notes" id="notes"></div>
</div>
<script>
const TOP='<div class="p row top"><div class="row"><span class="callout" style="position:static">1</span><b>Galactic Credit ▾</b><span class="pill">prod ▾</span></div><div class="row"><span class="stat"><small>Requests</small><b>4.2k/s</b></span><span class="stat"><small>Errors</small><b style="color:var(--red)">2.8%</b></span><span class="stat"><small>p99</small><b>640 ms</b></span><span class="stat"><small>DLQ</small><b style="color:var(--red)">37</b></span><span class="stat"><small>Incidents</small><b>1 sev2</b></span></div><div class="row"><span class="pill">🔍 Find a system…</span><span class="pill">☀ Day</span><span class="pill">Harbour ▾</span><span class="pill">?</span><span class="pill">⌂</span></div></div>';
const LEFT='<div class="p left"><span class="callout" style="right:-.8em;top:-.8em">2</span><h4>Break things</h4><div class="btns"><span>DLQ</span><span>Traffic spike</span><span>Slow</span><span>Errors</span><span>Down</span><span>Incident</span><span>Vendor outage</span><span>Calm</span></div><div class="chip">Errors · pay.card-api ✕<div class="bar"><i></i></div></div><div class="chip">DLQ · pay.settlement ✕<div class="bar"><i style="width:40%"></i></div></div><div class="chip" style="text-align:center">Reset all</div></div>';
const STORY='<div class="caption">Payments card API starts failing, retries pile up in the DLQ…</div><div class="p row story"><span class="callout" style="position:static">4</span><b>▶</b><span>Story: Cascade</span><div class="track"><i></i></div><span class="pill">1×</span></div>';
const RIGHT='<div class="p right"><span class="callout" style="left:-.8em;top:-.8em">3</span><div class="row" style="justify-content:space-between"><b>pay.card-api</b><span>✕</span></div><div class="row"><span class="status">Errors high</span><span class="pill">api · Payments</span></div><div class="kv"><div><small>Requests</small>820/s</div><div><small>Errors</small>7.4%</div><div><small>p99 / SLA</small>1.4 s / 1 s</div><div><small>Instances</small>5/6 healthy</div></div><div class="tabsm"><span>Overview</span><span>Links</span><span>Logs</span><span>Config</span></div><div class="log">Calls → pay.ledger, frd.score<br>Publishes → pay-card-outbox<br>Subscribed by → acc, rwd, dat<br>SLA 1 s (from pillar defaults)</div></div>';
const BDRAWER='<div class="p bottomdrawer"><span class="callout" style="left:-.8em;top:-.8em">3</span><div><div class="row" style="justify-content:space-between"><b>pay.card-api</b><span>✕</span></div><div class="row" style="margin-top:.5em"><span class="status">Errors high</span></div><div class="kv" style="margin-top:.6em"><div><small>Req</small>820/s</div><div><small>Err</small>7.4%</div><div><small>p99</small>1.4 s</div><div><small>Inst</small>5/6</div></div></div><div><div class="tabsm"><span>Overview</span><span>Links</span><span>Logs</span></div><div class="log">Calls → pay.ledger, frd.score<br>Publishes → pay-card-outbox<br>Subscribed by → acc, rwd, dat</div></div><div class="log">12:01:07 ERROR card network timeout (3.0 s)<br>12:01:07 WARN retry 2/3 for auth 81f…<br>12:01:08 ERROR circuit open: card-network</div></div>';
const TOOLBAR='<div class="p row toolbar" style="bottom:calc(30% + 2em)"><span class="callout" style="position:static">2</span><span>Scenario ▾</span><span>Story ▾</span><span>▶</span><span>View ⟲ ⟳</span><span>Find…</span></div>';
const LEGEND='<div class="p legend"><span class="callout" style="left:-.8em;top:-.8em">5</span><h4>Legend</h4><ul><li><span class="dot" style="background:var(--green)"></span>Beacon: errors (amber 1%, red 5%)</li><li>Floors: instances, dark = unhealthy</li><li>Walkers: sync calls, slow = latency, angry = over SLA</li><li>Boats and crates: messages and backlog</li><li><span class="dot" style="background:var(--red)"></span>Red pen + lighthouse: DLQ</li><li>Clouds and rain: incident on that pillar</li><li>Barriers + sign: down for repairs</li><li>Amber flag: legacy or undeclared route</li></ul></div>';
const L={
 a:{html:TOP+LEFT+RIGHT+STORY,notes:['<b>Top bar:</b> town and environment switchers, town-wide totals, search, Day/Dusk, theme, legend (?) and Home.','<b>Break things</b> (left, collapsible): scenario buttons, active chips with intensity sliders, Reset. Demo only, hidden for real sources.','<b>Inspector</b> slides in from the right when you click a building: status, key numbers, then tabs for links, logs and the effective config with where each value came from.','<b>Story bar</b> at the bottom with captions above it. Everything stays visible at once, and the town stays uncovered in the middle.']},
 b:{html:TOP+TOOLBAR+BDRAWER,notes:['<b>Top bar:</b> same as A.','<b>Toolbar</b> in the bottom middle: scenario, story, view and find menus. Scenario controls live in pop-up menus.','<b>Bottom drawer</b> opens when you click a building, about a third of the screen high and wide, with room for a log tail beside the numbers.','The drawer covers the bottom of the town and the story bar while it is open.']},
 legend:{html:TOP+LEFT+LEGEND+STORY,notes:['Top bar: the ? button toggles the legend.','Left panel as in A.','—','—','<b>Legend</b> card: one line per signal, in plain words. It opens the first time someone visits, then stays behind the ? button.']}
};
const ui=document.getElementById('ui'),notes=document.getElementById('notes'),bs=[...document.querySelectorAll('.tabs button')];
function show(k){ui.innerHTML=L[k].html;notes.innerHTML='<ol>'+L[k].notes.map(n=>'<li>'+n+'</li>').join('')+'</ol>';bs.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===k)))}
bs.forEach(b=>b.onclick=()=>show(b.dataset.l));show('a');
</script></body></html>

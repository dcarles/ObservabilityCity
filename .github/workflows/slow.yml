name: Slow checks

# The checks that take too long to wait for on every pull request: the 23- and 35-island stress towns in a browser (draw calls,
# frame time, build time) the full sample town with screenshots, and all three themes drawing both sample towns and playing a bad day (the pull request checks run the harbour theme only). They run when something is merged to main and every
# night, and can be started by hand from the Actions tab.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# The checks only read the code.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  browser:
    name: Stress town and full town
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: npm ci
        working-directory: frontend
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - name: Cache the browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install the browser
        if: steps.browser.outputs.cache-hit != 'true'
        # No --with-deps: the runner image already has Chromium's libraries, and install-deps
        # also pulls fonts and Xvfb through a slow apt mirror (minutes, sometimes a stall).
        run: npx playwright install chromium
        working-directory: frontend
      - run: dotnet build backend/src/ObservabilityCity.Host -c Release
      - name: 23-island stress town
        run: npm run e2e:stress
        working-directory: frontend
        env:
          E2E_NO_BUILD: '1'
      - name: 35-island stress town
        run: npm run e2e:stress35
        working-directory: frontend
        env:
          E2E_NO_BUILD: '1'
      - name: Full sample town, with screenshots
        if: success() || failure()
        run: npm run e2e:town
        working-directory: frontend
        env:
          E2E_NO_BUILD: '1'
      - name: All three themes on a bad day, in the town and on the dashboard
        if: success() || failure()
        run: npm run e2e:themes
        working-directory: frontend
        env:
          E2E_NO_BUILD: '1'
      - name: Keep the reports and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: slow-checks-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

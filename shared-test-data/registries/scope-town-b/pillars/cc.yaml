pillar: cc
displayName: Gamma
color: "#f2994a"
systems:
  - { id: cc.notify-api, service: notify, name: Notify API, role: api, external: true, calls: [cc.notify-db], gatewayCalls: [aa.orders-api, bb.ledger-api] }
  - { id: cc.notify-worker, service: notify, name: Notify worker, role: worker, calls: [cc.notify-db] }
  - { id: cc.notify-db, service: notify, name: Notify DB, role: db }
messaging:
  topics: [notify]
  subscriptions:
    - { topic: aa-orders-outbox, consumer: cc.notify-worker }
    - { topic: bb-ledger-outbox, consumer: cc.notify-worker }

  - { id: p22.s1-worker, service: s1, name: S1 worker, role: worker, calls: [p22.s1-db] }
  - { id: p22.s1-db, service: s1, name: S1 DB, role: db }
  - { id: p22.s2-api, service: s2, name: S2 API, role: api, calls: [p22.s2-db] }
  - { id: p22.s2-worker, service: s2, name: S2 worker, role: worker, calls: [p22.s2-db] }
  - { id: p22.s2-db, service: s2, name: S2 DB, role: db }
  - { id: p22.s3-api, service: s3, name: S3 API, role: api, calls: [p22.s3-db] }
  - { id: p22.s3-worker, service: s3, name: S3 worker, role: worker, calls: [p22.s3-db] }
  - { id: p22.s3-db, service: s3, name: S3 DB, role: db }
  - { id: p22.session-cache, name: Session cache, role: cache }
messaging:
  topics: [s1]
  subscriptions:

# yaml-language-server: $schema=../schema/pillar.schema.json
pillar: pay
displayName: Payments
color: "#f2994a"
defaults:
  api: { slaP99Ms: 500 }
systems:
  - { id: pay.payments-api, service: payments, name: Payments API, role: api, external: true, calls: [pay.payments-db, pay.refunds-api], gatewayCalls: [fra.screening-api, ldg.posting-api] }
  - { id: pay.payments-worker, service: payments, name: Payments worker, role: worker, calls: [pay.payments-db] }
  - { id: pay.payments-db, service: payments, tenantPattern: "merchant-{tenant}-db", name: Payments DB, role: db, engine: cosmos }
  - { id: pay.refunds-api, service: refunds, name: Refunds API, role: api, calls: [pay.refunds-db], gatewayCalls: [ldg.posting-api] }
  - { id: pay.refunds-worker, service: refunds, name: Refunds worker, role: worker, calls: [pay.refunds-db] }
  - { id: pay.refunds-db, service: refunds, tenantPattern: "merchant-{tenant}-db", name: Refunds DB, role: db, engine: cosmos }

# Messaging: the outboxes this pillar publishes (pay-<service>-outbox) and the topics its workers consume.
messaging:
  topics: [payments, refunds]
  subscriptions:
    - { topic: fra-screening-outbox, consumer: pay.payments-worker }
    - { topic: dec-decision-outbox, consumer: pay.payments-worker }
    - { topic: dsp-disputes-outbox, consumer: pay.refunds-worker }

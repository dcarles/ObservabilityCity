# Nothing connects this island: no API, no messaging, no call to or from another island. A registry warning says so.
pillar: sta
displayName: Standalone
color: "#9aa3ad"
systems:
  - { id: sta.idle-cron, service: idle, name: Idle job, role: cron }
scheduler:
  - system: sta.idle-cron
    jobs: { daily: [idle], hourly: [idle] }

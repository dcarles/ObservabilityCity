# Weekly pull requests, on Mondays, for newer versions of the libraries and build actions the repo uses.
# A dependency goes into the first group whose pattern matches it, so the families that must move together come first.
# Everything else that is a minor or patch update shares one pull request per ecosystem; other major updates stay one pull request each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      three:
        patterns: [three, "@types/three"]
      vite-and-vitest:
        patterns: [vite, vitest]
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node 26 is the version the repo runs on: the type definitions follow it, not newer majors.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The SignalR client follows the .NET release, and the repo stays on .NET 10 (LTS): no 11.x.
      - dependency-name: "@microsoft/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      aspire:
        patterns: ["Aspire.*"]
      dotnet-10:
        patterns: ["Microsoft.AspNetCore.*", "Microsoft.Extensions.*"]
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The repo stays on .NET 10 (LTS): these packages follow the .NET release, so no 11.x. Minor and patch updates (10.x) still come.
      # Moving to a newer .NET is done on purpose, in its own pull request, and these rules change with it (see AGENTS.md).
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
  # setup-dotnet in the workflows asks for 10.0.x on purpose; Dependabot does not change that line.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      github-actions:
        patterns: ["*"]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Observability City</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8F%99%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="town"></canvas>
    <!-- the search box sits between the two redrawn halves of the bar, so a redraw never takes its focus away -->
    <header id="topbar">
      <div id="topbar-left" class="dyn"></div>
      <div id="view-bar"></div>
      <div id="search"><input id="search-input" type="search" placeholder="Search systems and islands  ( / )" autocomplete="off" spellcheck="false" /><div id="search-results" class="picker-results" hidden></div></div>
      <div id="topbar-right" class="dyn"></div>
      <div id="tools">
        <button id="view-switch" title="Show the same data as a plain dashboard">Dashboard</button>
        <button id="lighting" title="Switch between Day and Dusk">Day</button>
        <button id="legend-button" title="What things mean" aria-label="Legend">?</button>
        <button id="home" title="Frame the whole town">Home</button>
      </div>
    </header>
    <div id="dash-root" hidden>
      <header id="dash-menu">
        <div class="wrap">
          <span class="brand" id="dash-brand"></span>
          <span class="seg" role="group" aria-label="View"><button id="vs-town" aria-pressed="false">Town</button><button id="vs-dash" aria-pressed="true">Dashboard</button></span>
          <span id="dash-filters"></span>
          <span class="vb"><button class="btn" id="pillars-button" aria-expanded="false">Pillars ▾</button><div id="pillar-menu" hidden></div></span>
          <span class="sp"></span>
          <button class="btn" id="dash-theme" title="Switch between light and dark">Dark</button>
          <span class="fresh"><button class="btn" id="fresh-button" aria-expanded="false">Connecting…</button><div id="fresh-pop" hidden></div></span>
          <span class="livepill wait" id="dash-status"><i class="dot"></i><span>Connecting…</span></span>
        </div>
      </header>
      <div class="wrap">
        <div class="sum" id="dash-sum"></div>
        <h2>Pillars</h2>
        <div id="dash-pillars"></div>
        <div id="hidden-pillars"></div>
        <h2>More</h2>
        <div id="dash-sections"></div>
        <div id="dash-more"></div>
      </div>
    </div>
    <aside id="break-panel" hidden></aside>
    <section id="story-bar" hidden></section>
    <div id="state-list" hidden></div>
    <aside id="service-panel" hidden></aside>
    <aside id="inspector" hidden></aside>
    <aside id="legend" hidden></aside>
    <div id="tooltip" hidden></div>
    <div id="unknown-hosts" hidden></div>
    <div id="notices" hidden></div>
    <div id="banner" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

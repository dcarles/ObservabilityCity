# yaml-language-server: $schema=schema/hub.schema.json
displayName: Platform hub
color: "#f5c26b"
# Two gateways, two brokers and two shared databases: each is its own building on the hub.
resources:
  - { id: hub.apim, name: API gateway, role: gateway }
  - { id: hub.partner-apim, name: Partner API gateway, role: gateway }
  - { id: hub.service-bus, name: Service Bus, role: broker }
  - { id: hub.event-stream, name: Event streaming, role: broker }
  - { id: hub.egress, name: Central egress, role: egress }
  - { id: hub.customer-db, name: Shared customer DB, role: db, engine: sqlserver }
  - { id: hub.reference-db, name: Shared reference DB, role: db, engine: sqlserver }
# The exports topic: for external destinations (Snowflake) and pillars that read it. Published as hub-exports.
messaging:
  topics: [exports]
# Outside callers of the town (apps, partners, vendors' webhooks). Each lists the external systems it reaches.
externalCallers:
  - { id: mobile-app, name: Mobile app, calls: [ldg.ledger-api, pay.payments-api, rwd.points-api] }
  - { id: partner-portal, name: Partner portal, calls: [acq.applications-api, bil.invoices-api, reg.reports-api] }
  - { id: open-banking-tpp, name: Third-party providers, calls: [obk.consents-api, obk.data-api] }
  - { id: merchant-systems, name: Merchant systems, calls: [pay.payments-api, dsp.disputes-api] }

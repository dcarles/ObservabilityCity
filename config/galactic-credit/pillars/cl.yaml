# yaml-language-server: $schema=../schema/pillar.schema.json
pillar: cl
displayName: Core Ledger
color: "#5aa9ff"
defaults:
  api: { slaP99Ms: 300 }
systems:
  # Most core credit apps are one API, one worker and one database. Systems that share a
  # service name are drawn side by side as one block. `calls` lists the systems one calls directly,
  # and cars drive along those links only.
  - { id: cl.ledger-api, service: ledger, name: Ledger API, role: api, external: true, slaP99Ms: 800, calls: [cl.ledger-db, cl.session-cache, cl.posting-api] }
  - { id: cl.ledger-worker, service: ledger, name: Ledger worker, role: worker, calls: [cl.ledger-db] }
  - { id: cl.ledger-db, service: ledger, name: Ledger DB, role: db }
  - { id: cl.posting-api, service: posting, name: Posting API, role: api, calls: [cl.posting-db, cl.session-cache] }
  - { id: cl.posting-worker, service: posting, name: Posting worker, role: worker, calls: [cl.posting-db, cl.statements-api] }
  - { id: cl.posting-db, service: posting, name: Posting DB, role: db }
  - { id: cl.statements-api, service: statements, name: Statements API, role: api, calls: [cl.statements-db, cl.ledger-api], gatewayCalls: [ntf.dispatch-api] }
  - { id: cl.statements-worker, service: statements, name: Statements worker, role: worker, calls: [cl.statements-db] }
  - { id: cl.statements-db, service: statements, name: Statements DB, role: db }
  - { id: cl.statement-cron, name: Statement run, role: cron, calls: [cl.statements-api] }
  - { id: cl.session-cache, name: Session cache, role: cache }

# Messaging: the outboxes this pillar publishes (cl-<service>-outbox) and the topics its workers consume.
messaging:
  topics: [ledger, posting, statements]
  subscriptions:
    - { topic: pay-payments-outbox, consumer: cl.ledger-worker }
    - { topic: bil-invoices-outbox, consumer: cl.ledger-worker }
    - { topic: pay-payments-outbox, consumer: cl.posting-worker }
    - { topic: pay-refunds-outbox, consumer: cl.posting-worker }
    - { topic: cl-ledger-outbox, consumer: cl.statements-worker }

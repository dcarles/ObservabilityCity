# yaml-language-server: $schema=../schema/pillar.schema.json
pillar: col
displayName: Collections
color: "#9b6bd6"
defaults:
  api: { slaP99Ms: 600 }
systems:
  - { id: col.cases-api, service: cases, name: Cases API, role: api, calls: [col.cases-db, col.queue-cache, col.dunning-api] }
  - { id: col.cases-worker, service: cases, name: Cases worker, role: worker, calls: [col.cases-db] }
  - { id: col.cases-db, service: cases, name: Cases DB, role: db }
  - { id: col.dunning-api, service: dunning, name: Dunning API, role: api, calls: [col.dunning-db, col.queue-cache, col.agency-api] }
  - { id: col.dunning-worker, service: dunning, name: Dunning worker, role: worker, calls: [col.dunning-db] }
  - { id: col.dunning-db, service: dunning, name: Dunning DB, role: db }
  - { id: col.agency-api, service: agency, name: Agency API, role: api, external: true, calls: [col.agency-db] }
  - { id: col.agency-worker, service: agency, name: Agency worker, role: worker, calls: [col.agency-db, col.queue-cache] }
  - { id: col.agency-db, service: agency, name: Agency DB, role: db }
  - { id: col.letters-cron, name: Letter run, role: cron, calls: [col.dunning-api, col.cases-api] }
  - { id: col.queue-cache, name: Work queue cache, role: cache }

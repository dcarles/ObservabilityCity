name: CI

# The checks that block a pull request. They run side by side, so the wait is the slowest job, not the sum.
# The slow checks (23-island stress town, full sample town with screenshots) are in slow.yml: they run on merge to main and nightly.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Only this job saves the NuGet cache; the other jobs run side by side and only restore it (two jobs saving one key collide).
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build backend/ObservabilityCity.slnx -c Release
      - run: dotnet test --solution backend/ObservabilityCity.slnx -c Release --no-build

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: npm ci
        working-directory: frontend
      - name: Contracts match the C# records
        run: npm run check:contracts
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Unit tests (includes the 23-island layout)
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  # The browser suites take turns on one worker each (they steer one fake source), so they are spread over runners instead:
  # the wait is the slowest group, about three minutes. Every suite is in exactly one group (npm run e2e runs them all in a row).
  ui-scenarios:
    name: UI scenario tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: scenarios, suites: 'scenarios' }
          - { group: ui, suites: 'ui' }
          - { group: towns, suites: 'towns' }
          - { group: links and tenants, suites: 'links tenants' }
          - { group: other towns, suites: 'direct live sources scope' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: npm ci
        working-directory: frontend
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - name: Cache the browser
        id: browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install the browser
        if: steps.browser.outputs.cache-hit != 'true'
        # No --with-deps: the runner image already has Chromium's libraries, and install-deps
        # also pulls fonts and Xvfb through a slow apt mirror (minutes, sometimes a stall).
        run: npx playwright install chromium
        working-directory: frontend
      - name: Build the backend
        run: dotnet build backend/src/ObservabilityCity.Host -c Release
      - name: UI scenarios
        # every suite of the group runs, even when one fails, so a run shows all that is broken
        run: |
          fail=0
          for suite in ${{ matrix.suites }}; do npm run "e2e:$suite" || fail=1; done
          exit $fail
        working-directory: frontend
        env:
          E2E_NO_BUILD: '1'
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-scenarios-report-${{ matrix.group }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  registries:
    name: Registry checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Check every registry folder in the repo
        id: validate
        continue-on-error: true
        run: dotnet run --project backend/tools/ObservabilityCity.Validate -c Release -- --all --github --markdown "$RUNNER_TEMP/registry-report.md"
      - name: Show the result on the pull request
        # Fork pull requests get a read-only token and cannot comment; the annotations on the files still appear.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/registry-report.md`, 'utf8');
            const clear = body.includes('all clear');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body.startsWith('<!-- registry-validation -->'));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else if (!clear) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
      - name: Fail when a registry has errors
        if: steps.validate.outcome == 'failure'
        run: exit 1

  # One name for branch protection to require. It passes only when every check above passed.
  checks:
    name: PR checks
    if: always()
    needs: [backend, frontend, ui-scenarios, registries]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then exit 1; fi

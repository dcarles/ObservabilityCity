pillar: p32
displayName: Pillar 32 (6)
color: "#9b51e0"
systems:
  - { id: p32.s1-api, service: s1, name: S1 API, role: api, external: true, calls: [p32.s1-db, p32.s2-api] }
  - { id: p32.s1-worker, service: s1, name: S1 worker, role: worker, calls: [p32.s1-db] }
  - { id: p32.s1-db, service: s1, name: S1 DB, role: db }
  - { id: p32.s2-api, service: s2, name: S2 API, role: api, calls: [p32.s2-db] }
  - { id: p32.s2-worker, service: s2, name: S2 worker, role: worker, calls: [p32.s2-db] }
  - { id: p32.s2-db, service: s2, name: S2 DB, role: db }
messaging:
  topics: [s1]
  subscriptions:
    - { topic: p31-s1-outbox, consumer: p32.s1-worker }
    - { topic: p31-s1-outbox, consumer: p32.s2-worker }

# yaml-language-server: $schema=../schema/pillar.schema.json
group: ntf
displayName: Notifications
color: "#ff6b9d"
systems:
  - { id: ntf.dispatch-api, service: dispatch, name: Dispatch API, role: api, calls: [ntf.dispatch-db] }
  - { id: ntf.dispatch-worker, service: dispatch, name: Dispatch worker, role: worker, calls: [ntf.dispatch-db] }
  - { id: ntf.dispatch-db, service: dispatch, name: Dispatch DB, role: db, engine: cassandra }
messaging:
  subscriptions:
    - { topic: orders.events, consumer: ntf.dispatch-worker }
    - { topic: shipments.events, consumer: ntf.dispatch-worker }
